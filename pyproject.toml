[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "salvage7z"
description = "Recover data from damaged .7z archives whose index (end header) is lost"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dynamic = ["version"]
dependencies = []
keywords = ["7z", "7-zip", "recovery", "data-recovery", "lzma2", "corrupt-archive", "file-carving"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Archiving",
    "Topic :: System :: Recovery Tools",
]

[project.urls]
Homepage = "https://github.com/kartikddoshi/salvage7z"
Issues = "https://github.com/kartikddoshi/salvage7z/issues"

[project.scripts]
salvage7z = "salvage7z.cli:main"

[tool.setuptools.dynamic]
version = { attr = "salvage7z.__version__" }

[tool.setuptools.packages.find]
where = ["src"]
