name: release

# Push a tag like v0.1.0 to build the package and publish a GitHub release with it.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Run tests
        run: python -m unittest discover -s tests
      - name: Build wheel and source archive
        run: |
          pip install build
          python -m build
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "salvage7z ${GITHUB_REF_NAME#v}" \
            --notes-file .github/release-notes.md
